name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.1.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The release body comes from the annotated tag's own message, and a
          # shallow clone does not fetch tag objects.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # A tag does not match ci.yml's triggers, so without repeating the gates
      # here a release could ship code that CI would have rejected.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all --locked

      - name: Icons match their source
        run: |
          python tools/gen_icons.py
          git diff --exit-code -- assets/active.ico assets/idle.ico

      # --locked so the published binary is reproducible from the tagged tree.
      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: pwsh
        # Tag names arrive through the environment, never interpolated into the
        # script body: ${{ }} is substituted as text before pwsh parses it, and
        # $(...) inside a double quoted string would then execute.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "unexpected tag: $tag" }
          $version = $tag -replace '^v', ''
          $name = "caffeinate-$version-x86_64-windows"

          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/caffeinate.exe,
                    target/release/caffeinate-tray.exe,
                    README.md,
                    LICENSE `
                    -Destination "dist/$name"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

          # Scoop manifests need the SHA256. It goes in the release notes for
          # people, and into a sidecar file so scoop's autoupdate can read it
          # without anyone hand editing a manifest for every release.
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash *$name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"

          "tag=$tag"                       >> $env:GITHUB_OUTPUT
          "version=$version"               >> $env:GITHUB_OUTPUT
          "asset=dist/$name.zip"           >> $env:GITHUB_OUTPUT
          "checksum=dist/$name.zip.sha256" >> $env:GITHUB_OUTPUT
          "hash=$hash"                     >> $env:GITHUB_OUTPUT

          # The changelog lives in the tag itself, so it is written once and
          # cannot drift from what was actually released. Everything after the
          # subject line is the body.
          #
          # actions/checkout leaves the tag as a lightweight ref, and
          # %(contents) on one of those silently yields the *commit* message
          # instead. Re-fetch to get the real tag object, then insist on it:
          # publishing a release whose notes are somebody's commit message is
          # worse than failing the job.
          git fetch --force --tags --quiet
          $type = git cat-file -t $tag
          if ($type -ne 'tag') {
            throw "$tag is a $type, not an annotated tag. The changelog is read from the tag message, so tag with -a."
          }
          $message = git tag -l --format='%(contents)' $tag
          $notes = ($message -split "`n" | Select-Object -Skip 1) -join "`n"
          $notes = $notes.Trim()
          "notes<<CHANGELOG_EOF"  >> $env:GITHUB_OUTPUT
          $notes                  >> $env:GITHUB_OUTPUT
          "CHANGELOG_EOF"         >> $env:GITHUB_OUTPUT

          Write-Host "packaged $name.zip  sha256=$hash"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          HASH: ${{ steps.package.outputs.hash }}
          CHANGELOG: ${{ steps.package.outputs.notes }}
        run: |
          $notes = @"
          $env:CHANGELOG

          ### Install

          ``````console
          scoop bucket add zet235 https://github.com/zet235/scoop-bucket
          scoop install caffeinate
          ``````

          Or unzip anywhere: put ``caffeinate.exe`` on your ``PATH`` and run
          ``caffeinate-tray.exe`` when you want the tray icon.

          ### Checksum

          ``````
          SHA256  $env:HASH
          ``````
          "@
          gh release create $env:TAG $env:ASSET $env:CHECKSUM --title $env:TAG --notes "$notes"
