[package]
name = "caffeinate"
version = "0.1.0"
edition = "2024"
description = "Keep Windows awake, from the tray or the command line"
repository = "https://github.com/zet235/caffeinate"
license = "MIT"

[[bin]]
name = "caffeinate-tray"
path = "src/main.rs"

[dependencies]
tray-icon = "0.24.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
